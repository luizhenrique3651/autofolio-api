spring:
  application:
    name: autofolio-api
  
  # Java 21 Virtual Threads Activation (Global)
  threads:
    virtual:
      enabled: true

  jpa:
    open-in-view: false

  # SMTP: defaults de dev (SMTP local); o profile prod exige as variáveis MAIL_*
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASS:}
    properties:
      mail:
        smtp:
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # Common JSON Formatting
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSSZ
    serialization:
      write-dates-as-timestamps: false

# Monitoring & Health
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  health:
    mail:
      # O probe do /actuator/health não deve conectar no SMTP (recurso não crítico): SMTP fora derrubaria o health
      enabled: false

# API Documentation Base
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# Security (JWT) - chave HS256 (mínimo 32 caracteres) vinda do ambiente
jwt:
  secret: ${JWT_SECRET}

# Remetente dos e-mails transacionais (alguns provedores usam usuário fixo, ex.: "apikey", então não derivar de MAIL_USER)
app:
  mail:
    from: ${MAIL_FROM:noreply@autofolio.com}

# Pattern de log com o requestId (MDC) para rastrear a requisição, inclusive nas tarefas @Async
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{requestId}] %logger{36} - %msg%n"

# URL do frontend (CORS e link do e-mail de redefinição de senha); FRONTEND_URL vem do .env
frontend:
  url: ${FRONTEND_URL:http://localhost:5173}
