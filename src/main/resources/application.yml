server:
  port: 8080

spring:
  application:
    name: autofolio-api
  
  # Java 21 Virtual Threads Activation
  threads:
    virtual:
      enabled: true

  # Database Configuration (Placeholders for now)
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/autofolio}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Flyway configuration
  flyway:
    enabled: true
    baseline-on-migrate: true

# Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
