spring:
  application:
    name: autofolio-api

  datasource:
    hikari:
      # Timeouts explícitos (ADR-001 §4.2): o banco é consultado em toda requisição autenticada
      # (ActiveAccountValidator); sem isso, banco fora custaria 30 s (padrão do Hikari) por
      # requisição antes do 503. connection-timeout: espera por conexão do pool, em ms.
      connection-timeout: 4000
      # pgjdbc: sem o "Detail: Key (coluna)=(valor)" nas mensagens de erro do servidor, que o
      # Hibernate logaria em ERROR com e-mail etc. (ADR-001 §1.6). Vale para todos os profiles
      data-source-properties:
        logServerErrorDetail: false
        # pgjdbc: conexão TCP com o servidor, em segundos
        connectTimeout: 4
  
  # Java 21 Virtual Threads Activation (Global)
  threads:
    virtual:
      enabled: true

  jpa:
    hibernate:
      # Valida entidade x migration em todos os profiles (e nos ITs, que rodam sem profile)
      ddl-auto: validate
    open-in-view: false

  # Upload multipart (foto de perfil): 5 MB por arquivo; excedente vira 413 em ProblemDetail
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  # SMTP: defaults de dev (SMTP local); o profile prod exige as variáveis MAIL_*
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASS:}
    properties:
      mail:
        smtp:
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # Common JSON Formatting
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSSZ
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      # "transmission": 1 não pode virar o enum de ordinal 1, e "km": 1.5 não pode ser truncado
      fail-on-numbers-for-enums: true
      accept-float-as-int: false

# Tomcat: ao recusar um upload acima do limite, drena até 10 MB do corpo restante. Com o padrão
# (2 MB) a conexão é derrubada no meio do envio e o cliente não recebe o 413
server:
  tomcat:
    max-swallow-size: 10MB

# Monitoring & Health
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  health:
    mail:
      # O probe do /actuator/health não deve conectar no SMTP (recurso não crítico): SMTP fora derrubaria o health
      enabled: false

# API Documentation Base
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# Cloudinary: timeouts explícitos (ADR-001 §4.2); as credenciais ficam nos profiles
cloudinary:
  connect-timeout: 5s
  read-timeout: 15s

# Security (JWT) - chave HS256 (mínimo 32 caracteres) vinda do ambiente
jwt:
  secret: ${JWT_SECRET}

# Remetente dos e-mails transacionais (alguns provedores usam usuário fixo, ex.: "apikey", então não derivar de MAIL_USER)
app:
  mail:
    from: ${MAIL_FROM:noreply@autofolio.com}

# Pattern de log com o requestId (MDC) para rastrear a requisição, inclusive nas tarefas @Async
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{requestId}] %logger{36} - %msg%n"

# URL do frontend (CORS e link do e-mail de redefinição de senha); FRONTEND_URL vem do .env
frontend:
  url: ${FRONTEND_URL:http://localhost:5173}

# Fuso do negócio (vendedores no Brasil): regras que dependem da data civil, como o teto do ano de
# fabricação, usam este fuso, não o UTC do Clock global
business:
  zone: America/Sao_Paulo
