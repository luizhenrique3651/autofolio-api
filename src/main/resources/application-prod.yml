spring:
  # Strict Production Database Configuration
  datasource:
    url: ${DATABASE_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  # Production Mail: exige as variáveis (sem defaults de dev); timeouts vêm do application.yml
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER}
    password: ${MAIL_PASS}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Frontend: exige a variável (sem o default de dev), senão CORS e link do e-mail apontariam para localhost
frontend:
  url: ${FRONTEND_URL}

# External Integrations (Cloudinary)
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

# Logging Strategy for Production
logging:
  level:
    root: INFO
    com.autofolio: INFO
