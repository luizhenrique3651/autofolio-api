version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: autofolio-db-local
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - autofolio-db-data:/var/lib/postgresql/data
    networks:
      - autofolio-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: autofolio-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - autofolio-network

networks:
  autofolio-network:
    driver: bridge

volumes:
  autofolio-db-data:
    driver: local
